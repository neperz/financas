<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Box -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#shieldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Shield Shape -->
  <path d="M256 72 L384 128 V248 C384 344 324 416 256 448 C188 416 128 344 128 248 V128 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Dark Shield Overlay -->
  <path d="M256 96 L360 142 V242 C360 322 310 384 256 412 C202 384 152 322 152 242 V142 Z" fill="#090d16" opacity="0.85"/>

  <!-- Growth Trend Arrow + Currency Graph -->
  <path d="M190 320 L235 260 L280 285 L330 200" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 200 H330 V230" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle Accent -->
  <circle cx="330" cy="200" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>